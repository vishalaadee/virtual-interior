<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sajawat Home Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..700&family=Instrument+Sans:wght@400..700&family=Noto+Sans+Devanagari:wght@400..600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: a quiet showroom. Questions and controls on the left, a lit 3D model of the room
     pinned on the right like a display plinth, with a title block underneath. */
  --paper:#F3F1ED; --surface:#FFFFFF; --ink:#1C1B19; --muted:#69645C; --line:#DCD7CE;
  --accent:#7E5C2E; --on-accent:#FFFFFF; --accent-soft:#F1E8D9;
  --good:#2F6B4A; --good-soft:#E3EFE6; --warn:#8A5A00; --warn-soft:#FBF0D9;
  --display:"Bodoni Moda","Didot",Georgia,serif;
  --body:"Instrument Sans","Noto Sans Devanagari",system-ui,"Segoe UI",Roboto,sans-serif;
  --r:4px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131211; --surface:#1C1B19; --ink:#EDE9E2; --muted:#A39D93; --line:#34312D;
    --accent:#D5B27A; --on-accent:#1C1408; --accent-soft:#3A2F1E;
    --good:#86CDA3; --good-soft:#18301F; --warn:#F0C060; --warn-soft:#3A2E10; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#131211; --surface:#1C1B19; --ink:#EDE9E2; --muted:#A39D93; --line:#34312D;
  --accent:#D5B27A; --on-accent:#1C1408; --accent-soft:#3A2F1E;
  --good:#86CDA3; --good-soft:#18301F; --warn:#F0C060; --warn-soft:#3A2E10; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16.5px/1.5 var(--body)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:clamp(30px,3.6vw,46px);line-height:1.06;font-weight:500;letter-spacing:-.01em}
h2{font-size:24px;line-height:1.2;font-weight:500}
h3{font-size:17px;line-height:1.3;font-weight:600;font-family:var(--body)}
p{margin:0}
ul{margin:0;padding-left:20px}
button,input,select,textarea{font:inherit;color:inherit}
img,canvas,video{max-width:100%}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.lede{color:var(--muted);max-width:62ch;font-size:18px;line-height:1.45}
.hint{color:var(--muted);font-size:15px}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:9px 20px;font-weight:600;cursor:pointer;line-height:1.2}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.quiet{border-color:var(--line)}
.btn.small{padding:6px 14px;font-size:14.5px}
.btn:disabled{opacity:.45;cursor:default}

.top{display:flex;align-items:center;gap:12px 28px;padding:12px clamp(16px,3vw,32px);border-bottom:1.5px solid var(--ink);background:var(--surface);flex-wrap:wrap}
.brand{font:600 26px/1 var(--display);letter-spacing:.01em}
.brand span{font:400 14px var(--body);color:var(--muted);margin-left:8px;letter-spacing:0}
.steps{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.step{display:flex;align-items:center;gap:8px;border:0;background:none;padding:6px 12px 6px 6px;border-radius:999px;cursor:pointer;font-weight:550;color:var(--muted)}
.step b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;font-size:14px;font-variant-numeric:tabular-nums}
.step.on{color:var(--ink);background:var(--paper)}
.step.on b{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
@media(max-width:620px){.step:not(.on) span{display:none}.step{padding-right:6px}.step.on{padding-right:12px}}

.wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;padding:28px clamp(16px,3vw,32px) 72px;max-width:1260px;margin:0 auto;align-items:start}
.wrap.full{grid-template-columns:minmax(0,1fr)}
#stage{display:grid;gap:22px;min-width:0}
#board{position:sticky;top:16px;display:grid;gap:14px}
#board[hidden]{display:none}
@media(max-width:920px){.wrap{grid-template-columns:minmax(0,1fr)}#board{position:static}}

.sheet{border:1px solid var(--ink);background:var(--surface);border-radius:2px;overflow:hidden;box-shadow:0 18px 40px -24px rgba(0,0,0,.55)}
.scene.orbit{cursor:grab;touch-action:pan-y}.scene.orbit:active{cursor:grabbing}
.scene svg{display:block;width:100%;height:auto}
.tblock{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);margin:0;border-top:1px solid var(--ink)}
.tblock div{padding:6px 10px 7px;border-left:1px solid var(--ink);min-width:0}
.tblock div:first-child{border-left:0}
.tblock dt{font-size:12px;color:var(--muted);line-height:1.2}
.tblock dd{margin:0;font-weight:600;font-size:14.5px;line-height:1.2;overflow-wrap:anywhere}
.mk{cursor:pointer}
.mk circle{fill:#fff;stroke:#1C1B19;stroke-width:1.2}
.mk text{font:700 10.5px var(--body);fill:#1C1B19;pointer-events:none}
.mk.on circle{fill:#B8914F;stroke:#fff}
.mk.on text{fill:#fff}
.mk:focus-visible{outline:none}
.mk:focus-visible circle{stroke:#B8914F;stroke-width:3}

.swrow{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.sw{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--surface);min-width:0}
.sw i{display:block;height:40px}
.sw small{font-size:11.5px;padding:2px 4px 3px;line-height:1.2;white-space:nowrap;overflow:hidden}
.picks{list-style:none;margin:0;padding:0;font-size:15px;display:grid;gap:0}
.picks li{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.picks li span:first-child{color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;min-width:0}
.card>h2,.card>h3{margin-bottom:-4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:550;font-size:15px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.field{display:grid;gap:4px;font-size:15px;font-weight:550;min-width:0}
.field input,.field textarea,.field select,.rname{border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);padding:8px 10px;font-weight:400;font-size:16px;width:100%}
.field textarea{resize:vertical;min-height:64px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>.field{flex:1 1 110px}

.room header{display:flex;gap:10px;align-items:center}
.rname{font:500 21px var(--display);flex:1;min-width:0}
.drop{position:relative;display:grid;gap:2px;justify-items:start;border:1.5px dashed var(--muted);border-radius:var(--r);padding:16px 18px;cursor:pointer;background:var(--paper)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{font-weight:650}
.drop span{color:var(--muted);font-size:15px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.th{position:relative;width:92px;height:70px;border-radius:4px;overflow:hidden;border:1px solid var(--line);background:var(--paper)}
.th>button.v{all:unset;display:block;width:100%;height:100%;cursor:pointer}
.th>button.v:focus-visible{outline:2.5px solid var(--accent);outline-offset:-3px}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .tag{position:absolute;left:4px;bottom:4px;background:#17262B;color:#fff;font-size:11.5px;padding:1px 6px;border-radius:3px;font-stretch:85%}
.th .x{position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;border:0;background:#17262B;color:#fff;cursor:pointer;line-height:1;font-size:14px}
.th.sel{outline:2.5px solid var(--accent);outline-offset:1px}
.err{color:var(--warn);background:var(--warn-soft);padding:8px 12px;border-radius:var(--r);font-size:15px}
.addroom{display:grid;gap:8px}
.nextbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding-top:6px}
.nextbar .sp{flex:1}

.qcount{color:var(--muted);font-weight:550;font-stretch:88%}
.qdots{display:flex;gap:6px;list-style:none;padding:0;margin:0;flex-wrap:wrap}
.qdots button{width:28px;height:8px;border-radius:4px;border:0;background:var(--line);cursor:pointer;padding:0}
.qdots button.done{background:var(--muted)}
.qdots button.cur{background:var(--accent)}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.opts{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.opts.styles{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.opt{display:flex;flex-direction:column;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0;cursor:pointer;overflow:hidden;position:relative;min-width:0}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.opt .tick{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:#B8914F;color:#fff;display:none;place-items:center;font-size:14px;font-weight:700;z-index:1}
.opt[aria-pressed="true"] .tick{display:grid}
.opt .txt{padding:10px 13px 12px;display:grid;gap:1px}
.opt b{font-weight:650;line-height:1.25}
.opt .txt span{color:var(--muted);font-size:14.5px;line-height:1.35}
.opt .band{display:flex;height:54px}
.opt .band i{flex:1}

.pals{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.rolerow{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.rolerow:first-of-type{border-top:0}
.rolepick{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);cursor:pointer;padding:0}
.rolepick[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4.5px var(--accent)}
.rolerow .nm{display:grid;line-height:1.25;min-width:0}
.rolerow .nm small{color:var(--muted);font-size:14px}
.rolerow input[type=color]{width:44px;height:36px;padding:0;border:1.5px solid var(--line);border-radius:var(--r);background:none;cursor:pointer}
.rolerow input[type=text]{width:92px;border:1.5px solid var(--line);border-radius:var(--r);padding:6px 8px;background:var(--surface);font-variant-numeric:tabular-nums;font-size:15px}
@media(max-width:480px){.rolerow{grid-template-columns:auto 1fr auto}.rolerow input[type=text]{display:none}}
.found{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.found button{width:44px;height:44px;border-radius:6px;border:1.5px solid var(--line);cursor:pointer;padding:0}
.inspo{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.inspo img{width:150px;height:110px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.filebtn{position:relative;display:inline-flex;align-items:center;border:1.5px solid var(--ink);border-radius:999px;padding:7px 16px;font-weight:600;cursor:pointer;font-size:15px}
.filebtn:focus-within{outline:2.5px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.paintwrap{border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--paper)}
.paintwrap canvas{display:block;width:100%;height:auto;cursor:crosshair;touch-action:manipulation}
.ptools{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center}
.ptools .pcol{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);cursor:pointer;padding:0}
.ptools .pcol[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4.5px var(--accent)}
.ptools label{display:flex;gap:8px;align-items:center;font-size:15px;font-weight:550}

.dhead{display:grid;gap:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px;cursor:pointer;font-weight:600;display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.tab i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.tab i.c{background:var(--good)}
.tab i.w{background:var(--accent);animation:pulse 1s infinite alternate}
@keyframes pulse{to{opacity:.3}}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:32px;align-items:start}
.dmain{display:grid;gap:30px;min-width:0}
.dside{position:sticky;top:16px;display:grid;gap:14px;min-width:0}
.look,.tools{display:grid;gap:14px;min-width:0}
@media(max-width:980px){.dgrid{grid-template-columns:minmax(0,1fr)}.dside{display:contents}.look{order:-1}.tools{order:1}}
.note{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-size:15.5px}
.note.good{background:var(--good-soft);border-color:transparent;color:var(--good);font-weight:550}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.note.work{border-color:var(--accent)}
.spin{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.blk{display:grid;gap:10px}
.blk>p{max-width:68ch}
.seen{background:var(--surface);border-left:3px solid var(--accent);padding:10px 14px;border-radius:0 var(--r) var(--r) 0}
.seen b{display:block;font-size:14.5px;color:var(--muted);font-weight:600}
.stops{list-style:none;margin:0;padding:0}
.stop{display:grid;grid-template-columns:36px minmax(0,1fr);gap:14px;padding:16px 0;border-top:1px solid var(--line);cursor:pointer}
.stop .n{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-weight:700;background:var(--surface);cursor:pointer;padding:0;font-variant-numeric:tabular-nums}
.stop.on .n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.stop>div{display:grid;gap:6px;max-width:66ch}
.stop ul{display:grid;gap:3px}
.stop .why{color:var(--muted);font-size:15.5px;border-left:2px solid var(--line);padding-left:10px}
.ctable,.itable,.ltable{display:grid}
.crow{display:grid;grid-template-columns:44px 150px minmax(0,1fr);gap:14px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.crow i{width:44px;height:44px;border-radius:4px;border:1px solid var(--line)}
.crow small,.irow small{display:block;color:var(--muted);font-size:14.5px;line-height:1.35}
.crow code{font:inherit;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.irow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) auto;gap:16px;padding:10px 0;border-top:1px solid var(--line)}
.irow .pr{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:550}
.irow .keep{color:var(--good);font-weight:600}
.lrow{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:16px;padding:10px 0;border-top:1px solid var(--line)}
.lrow b{font-weight:650}
@media(max-width:560px){.crow{grid-template-columns:44px minmax(0,1fr)}.crow .wh{grid-column:2}.irow{grid-template-columns:minmax(0,1fr)}.irow .pr{text-align:left}.lrow{grid-template-columns:minmax(0,1fr)}.irow,.lrow{gap:2px}}
.big{font:500 34px/1.1 var(--display);font-variant-numeric:tabular-nums}
.two{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}
.two>div{display:grid;gap:8px;align-content:start}
.tour{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.tour p{text-align:center;line-height:1.25;font-size:15px}
.tour p b{display:block;color:var(--muted);font-weight:600;font-size:13.5px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.refthumb{display:flex;gap:10px;align-items:center}
.refthumb img{width:64px;height:48px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.prows{display:grid;gap:0;overflow-x:auto}
.prow{display:grid;grid-template-columns:24px minmax(110px,1.4fr) minmax(110px,1fr) 80px 80px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);min-width:440px}
.prow.ph{border-top:0;font-size:13.5px;color:var(--muted)}
.prow input:not([type=checkbox]),.prow select{border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);padding:6px 8px;font-size:15px;width:100%}
.prow input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.prow small{grid-column:2/-1;color:var(--muted);font-size:13.5px}
.planimg{width:220px!important;height:150px!important;object-fit:contain!important;background:#fff}
dialog{border:1.5px solid var(--ink);border-radius:var(--r);background:var(--surface);color:var(--ink);padding:18px;max-width:min(92vw,900px)}
dialog::backdrop{background:rgba(10,20,22,.6)}
#viewbody img,#viewbody video{display:block;max-width:100%;max-height:74vh;margin-top:12px;border-radius:4px}
#confirm p{max-width:44ch;margin-bottom:16px}
@media (prefers-reduced-motion:reduce){.spin,.tab i.w{animation:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Sajawat<span>home designer</span></div>
  <nav class="steps" id="steps" aria-label="Steps"></nav>
  <button class="btn quiet small" data-act="reset" id="resetbtn">Start over</button>
</header>
<main class="wrap" id="wrap">
  <section id="stage"></section>
  <aside id="board" aria-label="Your sample board"></aside>
</main>
<dialog id="viewer" aria-label="Photo or video"><button class="btn small" data-act="closeview" id="closeview">Close</button><div id="viewbody"></div></dialog>
<dialog id="confirm" aria-labelledby="cfh"><h3 id="cfh">Start over?</h3><p>This removes your rooms, photos, answers and plans from this browser.</p><div class="row"><button class="btn" data-act="resetno" id="resetno">Keep my work</button><button class="btn primary" data-act="resetyes" id="resetyes">Start over</button></div></dialog>

<script>
(()=>{'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
let _n=0;const nid=p=>p+(++_n)+Math.random().toString(36).slice(2,6);
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const f1=n=>Math.round(n*10)/10;
const h2r=h=>{h=String(h).replace('#','');if(h.length===3)h=[...h].map(c=>c+c).join('');const n=parseInt(h,16)||0;return[n>>16&255,n>>8&255,n&255]};
const r2h=(r,g,b)=>'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>{const A=h2r(a),B=h2r(b);return r2h(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t)};
const lt=(h,t)=>mix(h,'#ffffff',t),dk=(h,t)=>mix(h,'#000000',t);
const hsl=h=>{const[r,g,b]=h2r(h).map(v=>v/255),mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let hh=0,s=0;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);hh=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;hh*=60}return[hh,s,l]};
const validHex=v=>/^#[0-9a-fA-F]{6}$/.test(v);

/* ---------- data ---------- */
const STYLES=[
{id:'quiet',name:'Quiet luxury',line:'Greige, travertine, walnut and bouclé',
 pal:{wall:'#E7E1D8',feature:'#CDBFAE',wood:'#5E4636',fabric:'#EFE9DF',accent:'#8C6E52',metal:'#9C7A4E',floor:'#C9B79E'},
 d:{treat:'limestone',lamp:'globes',leg:'plinth',floor:'oak',rug:'plain',art:'abstract',head:'panel'},

 L.state='work';L.msg='';renderAll();
 const prompt=['You are reading a floor plan or interior layout drawing of a home in India. List every room or space on it.',
 'For each room give: name exactly as written; type, one of '+PLANTYPES.join(', ')+' or other (toilet and bath are bathroom, drawing room and hall are living, puja and mandir are pooja, foyer is entry, utility and store are other); length_ft and width_ft as numbers in feet.',
 'Convert feet-and-inches such as 12\'6" to 12.5. Convert metres by multiplying by 3.281, and millimetres by dividing by 304.8. If the plan only shows the area, give area_sqft and leave length and width null. If there is a scale bar but no dimension text, estimate from the scale and set confidence to low.',
 'Also give ceiling_ft if shown, and openings: one short phrase on where the doors and windows are (for example "door on the left of the bottom wall, window on the right wall").',
 'Never invent a number you cannot read. Use null instead.',
 'Reply with only JSON: {"unit":"as written on the plan","total_sqft":null,"rooms":[{"name":"","type":"","length_ft":0,"width_ft":0,"area_sqft":null,"ceiling_ft":null,"openings":"","confidence":"high|medium|low"}],"warnings":[""]}'].join('\n');
 try{const r=await sample.json(prompt,{images:[L.blob],cache:false}),num=v=>{const n=parseFloat(v);return isFinite(n)&&n>0?Math.round(n*10)/10:''};
  const rows=(Array.isArray(r&&r.rooms)?r.rooms:[]).map(x=>{const t=String(x&&x.type||'').toLowerCase();return{use:PLANTYPES.includes(t),name:String(x&&x.name||'Room').slice(0,40),type:PLANTYPES.includes(t)?t:'living',l:num(x&&x.length_ft),w:num(x&&x.width_ft),h:num(x&&x.ceiling_ft),area:num(x&&x.area_sqft),open:String(x&&x.openings||''),conf:String(x&&x.confidence||'')}});
  L.rows=rows;L.warn=(Array.isArray(r&&r.warnings)?r.warnings:[]).map(String).filter(Boolean).slice(0,3);L.unit=String(r&&r.unit||'');L.state=rows.length?'done':'err';L.msg=rows.length?'':'No rooms could be read from this picture. Try a clearer or larger image of the plan.'}
 catch(e){const code=(e&&e.code)||'upstream_error';if(OFF.includes(code)){sample=null;sampleState='none'}L.state='err';L.msg=code==='image_rejected'?'Claude could not open this picture. Save the plan as a JPG or PNG and try again.':OFF.includes(code)?'Claude is not available in this view. Type the sizes into each room below.':aiCopy(code)}
 renderAll()}
function applyPlan(){const L=S.plan2,claimed=new Set();let first=null;
 for(const row of L.rows){if(!row.use)continue;let r=S.rooms.find(x=>!claimed.has(x.id)&&x.type===row.type&&!(parseFloat(x.l)>0));
  if(!r){r=newRoom(row.type);S.rooms.push(r)}claimed.add(r.id);r.name=row.name||r.name;if(row.l)r.l=String(row.l);if(row.w)r.w=String(row.w);if(row.h)r.h=String(row.h);r.est=false;r.fromPlan=true;r.layoutNote=row.open||'';r.plan=null;if(!first)first=r}
 if(first)S.active=first.id;L.applied=true;renderAll();saveSoon()}

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=ACT[el.dataset.act];if(f){if(el.tagName==='BUTTON'||el.tagName==='g'||el.tagName==='LI')e.preventDefault();f(el,e)}});
